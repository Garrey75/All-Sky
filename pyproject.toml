[project]
name = "allsky"
version = "0.1.0"
description = "Garrey All-Sky — a personal all-sky camera station"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pillow>=11.0.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[project.scripts]
allsky = "allsky.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["allsky*"]

[tool.setuptools.package-data]
allsky = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
